<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>百年小宗</title>
<style>
:root{color-scheme:dark;--ink:#eee9d9;--muted:#a8b6ac;--gold:#ead09a;--base:#101814;--surface:#18231d;--surface-raised:#202e25;--line:#37483c;--accent:#a94f3d;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--base);color:var(--ink);font:16px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif}
[hidden]{display:none!important}
button,input,select{font:inherit}button{cursor:pointer;border:1px solid #536758;border-radius:7px;background:#25372c;color:var(--ink);padding:7px 13px;line-height:1.35}button:hover:not(:disabled){background:#354d3d}button:disabled{opacity:.48;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.gold{font-weight:700;background:var(--gold);border-color:var(--gold);color:#252b1f}.gold:hover:not(:disabled){background:#f4dfb3}
main{max-width:1450px;margin:auto;padding:0 30px 44px}
header{height:75px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:13px;font-family:"STSong","SimSun",serif;font-size:26px;font-weight:700;letter-spacing:.12em}.seal{display:grid;place-items:center;width:36px;height:36px;border-radius:4px;background:#a94f3d;border:1px solid #ca8066;font-size:20px;color:#fff2dd;letter-spacing:0}
.hero{position:relative;overflow:hidden;background:#39534b;border:1px solid #526350}.hero canvas{width:100%;height:100%;display:block;object-fit:cover}.chapter-heading{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.chapter-heading h1{margin:0;font:700 23px "STSong","SimSun",serif}.chapter-heading small,.eyebrow{font-size:14px;color:var(--gold)}.campaign-bar{margin-top:8px}

.campaign-bar{display:flex;align-items:center;justify-content:space-between;margin:21px 0 10px;gap:12px}.calendar{font-size:14px;color:#d2dbcb}.top-stock,.strip{display:flex;flex-wrap:wrap;gap:8px}.top-stock{margin-bottom:20px}.top-stock span,.warehouse-stock span{flex:1;min-width:105px;border:1px solid var(--line);background:var(--surface);padding:9px 12px;border-radius:8px;display:grid;gap:3px;color:var(--muted);font-size:13px}.top-stock b,.warehouse-stock b{color:var(--gold);font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums}
.workspace{display:grid;grid-template-columns:174px minmax(0,1fr);gap:20px;align-items:start}nav{display:grid;gap:6px;position:sticky;top:14px}nav button{text-align:left;background:transparent;border-color:transparent;padding:11px 13px;display:flex;align-items:center;justify-content:space-between;white-space:nowrap}nav button[aria-current=true]{background:#283b30;border-color:#647461;color:#f0d7a4}.nav-count{background:#744334;color:#ffe4c5;padding:0 7px;border-radius:12px;font-size:12px}
.view{display:grid;gap:15px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 20px;min-width:0}.panel h2{font:700 24px/1.25 "STSong","SimSun",serif;margin:0 0 9px;color:#f4e6c8}.panel h3{margin:11px 0 4px;font-size:16px}.panel p{margin:6px 0}.chapter{border-color:#77664a;background:linear-gradient(105deg,#322e24,#202922 65%)}.chapter .eyebrow{display:block;margin-bottom:5px}.chapter-body{display:flex;justify-content:space-between;align-items:center;gap:12px}.chapter-body .actions{justify-content:flex-end;flex-shrink:0}.event{border-color:#7c6341;background:#2c291f}.pending+.pending{border-top:1px solid #66583e;margin-top:11px;padding-top:9px}.panel,.pending,.person{overflow-wrap:anywhere}.row,.actions{display:flex;gap:8px;align-items:center}.row{justify-content:space-between;padding:8px 0;flex-wrap:wrap}.actions{flex-wrap:wrap}.muted,small{color:var(--muted)}small{display:block;font-size:13px}.accent{color:var(--gold)}.stats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.stats span{border:1px solid var(--line);border-radius:5px;background:#202e25;padding:3px 7px;font-size:13px}.stats b{color:var(--gold)}
.person-name{display:flex;align-items:center;gap:9px}.portrait{width:35px;height:35px;display:grid;place-items:center;background:#374e3d;border:1px solid #5e7461;border-radius:7px;color:var(--gold);font:700 19px serif;flex:none}.work-status{font-size:13px;color:#bacdb9;max-width:13em}.meter{height:5px;background:#3a473e;border-radius:8px;overflow:hidden}.meter span{height:100%;display:block;background:#be9b56}details{margin:7px 0}summary{cursor:pointer;color:#d6decb}select,input:not([type=checkbox]){color:var(--ink);background:#101b15;border:1px solid #536b5b;border-radius:6px;padding:7px 9px;max-width:100%}label{font-size:14px}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.form-grid select{display:block;width:100%}.check{display:flex;align-items:center;gap:6px}.warehouse-stock{margin-bottom:10px}.formation,.allocation{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.formation div,.allocation div{background:#223329;border:1px solid var(--line);border-radius:7px;padding:7px 10px}.allocation div{display:flex;align-items:center;justify-content:space-between;gap:4px}.allocation button{padding:4px 8px}#start-screen{max-width:760px;margin:17px auto}.toast{padding:8px 12px;border-radius:6px;color:#f7dcaa;background:#32291f}.log p{border-bottom:1px solid var(--line);padding:7px 0}.mini{background:var(--base);padding:10px 12px;font-size:14px;min-height:100vh}.mini .hero{height:91px;border-radius:8px;margin-bottom:8px}.mini .panel{padding:9px 10px}.mini .strip{border-bottom:1px solid var(--line);padding:5px 0}.mini button{font-size:13px;padding:5px 8px}.mini .row{border-bottom:1px solid var(--line);padding:7px 0}.mini .mini-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.mini .mini-heading strong{font-size:18px}.mini-events{margin:8px 0}.mini-calendar{color:#c8d6c7}.float{position:fixed;z-index:5;bottom:12px;right:12px;width:min(400px,calc(100vw - 24px));min-height:0;max-height:80vh;overflow:auto;border:1px solid #718675;border-radius:10px;box-shadow:0 12px 45px #000a}
@media(max-width:760px){main{padding:0 13px 24px}header{height:62px}.workspace{grid-template-columns:1fr;gap:10px}nav{top:0;z-index:2;display:flex;overflow:auto;background:var(--base);padding:6px 0}nav button{gap:6px;padding:8px}.top-stock span{min-width:90px}.campaign-bar,.chapter-body{align-items:flex-start;flex-wrap:wrap}.panel{padding:13px}.allocation{grid-template-columns:repeat(2,minmax(0,1fr))}}

.building-deck{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,148px),1fr));gap:8px;margin:8px 0 17px}
.building-deck button{text-align:left;display:flex;gap:9px;align-items:center;padding:10px;background:#202e25;min-width:0}
.building-deck button[aria-pressed=true],.task-picks button[aria-pressed=true]{border-color:#bd9f6b;background:#354535;color:#f7dfac}
.building-mark{color:var(--gold);font:700 19px serif;background:#17241b;border:1px solid var(--line);border-radius:5px;padding:4px 7px}
.building-deck small{font-size:12px}.building-group+ .building-group{margin-top:13px}
.task-picks{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 14px}
.task-form{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.room-action{margin-top:8px}.building-group h3{color:var(--muted);font-size:14px}

.people-layout{display:grid;grid-template-columns:minmax(155px,220px) minmax(0,1fr);gap:14px;align-items:start}
.people-list{display:grid;gap:6px}.people-list button{display:flex;align-items:center;text-align:left;gap:9px;padding:9px;width:100%;min-width:0;overflow-wrap:anywhere;background:#202e25}
.people-list button[aria-pressed=true]{border-color:#bd9f6b;background:#354535}
.character-sheet{display:grid;gap:12px;min-width:0}
.character-progress{display:grid;gap:5px;margin-top:10px}
.character-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:8px 0}
.character-stats div{padding:8px;background:#202e25;border:1px solid var(--line);border-radius:6px;display:flex;justify-content:space-between;gap:4px;font-size:14px}
.character-stats b{color:var(--gold)}

@media(max-width:680px){.people-layout{grid-template-columns:1fr}.people-list{display:flex;overflow:auto;padding-bottom:5px}.people-list button{flex:0 0 auto;width:auto}.character-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.rpg-sheet{padding:14px;background:linear-gradient(145deg,#26362c,#131f18 60%);border:1px solid #5f6d54;border-radius:10px}
.rpg-summary{display:grid;grid-template-columns:minmax(130px,.85fr) minmax(0,1.65fr);gap:12px}
.rpg-medallion{min-width:0;min-height:156px;display:grid;place-items:center;align-content:center;gap:7px;text-align:center;border:1px solid #62684e;border-radius:9px;background:radial-gradient(circle at 50% 45%,#54644c,#25352b 65%,#202b23);padding:10px;overflow-wrap:anywhere}
.rpg-medallion .portrait{width:64px;height:64px;border-radius:50%;border:1px solid #c2a873;background:#1d2d23;box-shadow:0 0 0 5px #d1b57621;font-size:32px}
.rpg-medallion h3{margin:0;font:700 23px "STSong","SimSun",serif;color:#f7e7c3}
.rpg-side{display:grid;align-content:start;gap:8px;min-width:0}.rpg-card{min-width:0;padding:10px 12px;border:1px solid #435340;border-radius:8px;background:#17241c}.rpg-card h4{margin:0 0 7px;font-size:15px;color:#f0dbad}
.rpg-vitals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.rpg-vitals div{text-align:center;padding:6px 3px;background:#25362a;border-radius:5px}
.rpg-vitals strong{display:block;font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}.rpg-vitals small{font-size:12px}
.rpg-slots{display:grid;gap:6px}.rpg-slot{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center;padding:6px;border:1px solid #52654d;border-radius:6px;background:#202e24}.rpg-slot.empty{border-style:dashed}
.rpg-slot-icon,.rpg-art-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:5px;border:1px solid #6d7355;background:#2e4232;color:var(--gold);font:700 19px serif}
.rpg-slot select{width:100%;padding:4px 6px}
.rpg-arts{display:grid;gap:5px;margin-top:8px}.rpg-art{display:grid;grid-template-columns:35px minmax(0,1fr);gap:8px;align-items:center}.rpg-art-icon{width:34px;height:34px}.rpg-art small{overflow-wrap:anywhere}
@media(max-width:560px){.rpg-summary{grid-template-columns:1fr}.rpg-medallion{min-height:135px}}

.manual-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;margin-top:12px}
.manual-card{display:flex;flex-direction:column;gap:7px}.manual-card .actions{margin-top:auto}.manual-card.current{border-color:#aa9162}.manual-card h3{margin:0}.manual-meta{color:var(--gold)}.manual-skills{margin-top:16px}

.schedule-scroll{overflow:auto;padding:5px 3px 9px}.schedule-hours{display:grid;grid-template-columns:repeat(24,minmax(42px,1fr));gap:4px;min-width:1100px}
.schedule-cell{padding:5px 2px;text-align:center}.schedule-cell small{font-size:12px;color:inherit}.schedule-cell.current{outline:2px solid var(--gold);outline-offset:1px}
.schedule-cell:is([data-mode=duty],[data-mode=farm],[data-mode=field]){background:#30553e}.schedule-cell:is([data-mode=heal],[data-mode=study]){background:#53465f}.schedule-cell[data-mode=rest]{background:#24445c}.schedule-cell[data-mode=free]{background:#42443d}
.schedule-palette{margin:10px 0}.schedule-controls{margin-top:8px}
@media(max-width:760px){.schedule-hours{grid-template-columns:repeat(12,minmax(38px,1fr));min-width:490px}}
.inventory-groups,.warehouse-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}
.inventory-groups{margin:14px 0 24px}
.inventory-card{border:1px solid var(--line);border-radius:12px;background:#1b2a22;overflow:hidden}
.inventory-card h3{margin:0;padding:12px 16px;background:#26382d;color:#f0dfb3;font-size:16px;display:flex;align-items:center;gap:9px}
.inventory-mark{display:grid;place-items:center;width:25px;height:25px;border-radius:6px;background:#354939;color:var(--gold);font-size:13px}
.inventory-card dl{margin:0;padding:4px 16px}
.inventory-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}
.inventory-item+.inventory-item{border-top:1px solid var(--line)}
.inventory-item dt{color:var(--ink)}
.inventory-item dd{margin:0;color:var(--gold);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.inventory-item.is-empty dd{color:var(--muted);font-weight:400}
.warehouse-tools{align-items:start}
.warehouse-tools details{margin:0;border:1px solid var(--line);border-radius:10px;background:#18251e;padding:0 14px}
.warehouse-tools summary{padding:11px 0;font-weight:600}
.warehouse-tools details[open] summary{border-bottom:1px solid var(--line);margin-bottom:8px}
.warehouse-tools details[open]{padding-bottom:12px}
.map-layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(220px,1fr);gap:16px;align-items:start}
.map-grid{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));aspect-ratio:7/5;min-width:560px;background:#15231c;border:1px solid var(--line);border-radius:10px;isolation:isolate}
.map-scroll{overflow-x:auto}
.map-road{position:absolute;border-top:2px dashed #96ab89;transform-origin:left center;pointer-events:none}
.map-tile{position:relative;z-index:1;align-self:center;justify-self:center;padding:7px 5px;width:94%;font-size:clamp(11px,1vw,14px);line-height:1.2;background:#25382b;border:1px solid #63795f;color:#fff6dc}
.map-tile:hover{background:#39503d}.map-tile[aria-pressed=true]{border-color:#f0ca76;box-shadow:0 0 0 1px #f0ca76}
.map-tile.is-fog{background:#1d2923;border-style:dashed;color:#c1c8bd}
.map-alert{position:absolute;top:-9px;right:0;background:#edbf61;color:#2a2012;border-radius:4px;padding:1px 5px;font-weight:bold}
.map-details{min-width:0;max-height:min(76vh,760px);overflow:auto;padding:12px;border:1px solid var(--line);border-radius:10px;background:#192a21}
.map-details .form-grid{grid-template-columns:minmax(0,1fr)}.map-details .task-form{padding:10px}.map-legend{color:var(--muted);font-size:13px;margin:8px 0}
@media(max-width:850px){.map-layout{grid-template-columns:minmax(0,1fr)}.map-details{max-height:none}}
.battlefield-scroll{overflow-x:auto}.battlefield{display:grid;gap:6px;margin:8px 0 16px}.battlefield-row{display:grid;grid-template-columns:4em repeat(var(--battle-cols),minmax(60px,1fr));gap:5px;align-items:stretch}.battlefield-row>small{align-self:center}.battle-cell{min-height:44px;padding:4px;display:grid;place-items:center;border:1px solid #526756;border-radius:6px;background:#23372b;text-align:center;font-size:13px;overflow-wrap:anywhere}.battle-cell.enemy{background:#332720;border-color:#644a3c}.battle-cell.chosen{border-color:var(--gold);color:var(--gold)}.battle-cell.down{opacity:.55}
.town-window{width:min(900px,94vw);max-height:88vh;overflow:auto;color:var(--ink);background:var(--surface);border:1px solid #73866c;border-radius:14px;padding:20px}.town-window::backdrop{background:#000a}.town-window .town-header{position:sticky;top:-20px;background:var(--surface);z-index:2;padding:12px 0}.town-window .task-form{margin-top:12px}
.manual-art{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-raised)}.manual-art>*{display:block}
.dispatch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,78px),1fr));gap:7px;margin:9px 0}.dispatch-person{position:relative;min-width:0;aspect-ratio:1;display:grid;place-items:center;padding:2px}.dispatch-person[aria-pressed=true]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:#2c3d2c}.dispatch-person strong{display:block;overflow-wrap:anywhere}.dispatch-person small{font-size:11px;color:var(--gold)}.dispatch-person .dispatch-tag{position:absolute;right:3px;top:2px;font-size:10px}.dispatch-person .dispatch-status{position:absolute;bottom:2px;left:2px;right:2px;line-height:1.15;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.map-avatar{position:absolute;z-index:3;display:grid;place-items:center;width:23px;height:23px;border-radius:50%;border:1px solid #edcf87;background:#283e33;color:#fff2c6;font-size:12px;font-weight:700;transform:translate(-50%,-50%);pointer-events:auto;transition:left .48s linear,top .48s linear}.map-avatar.is-travelling{background:#6a542e}
</style>

<dialog id="town-window" class="town-window" aria-label="石桥镇"></dialog>
<main id="app">
<header><div class="brand"><span class="seal">宗</span> 百年小宗</div><button id="pip" class="gold" disabled>开启画中画</button></header>
<p id="notice" class="toast" role="status" hidden></p>
<div class="chapter-heading"><h1>青云宗</h1><small>照川 · 青崖山</small></div>
<section id="start-screen" class="panel chapter"><h2>正在读取宗门存档</h2></section>
<div id="game" hidden>
  <div class="campaign-bar"><div id="calendar" class="calendar"></div></div>
  <div id="resources" class="top-stock" aria-label="宗门库存"></div>
  <div class="workspace">
    <nav aria-label="宗门菜单">
      <button type="button" data-kind="view" data-value="overview" aria-current="true">宗门总览</button>
      <button type="button" data-kind="view" data-value="dispatch">建筑</button>
      <button type="button" data-kind="view" data-value="map">地图</button>
      <button type="button" data-kind="view" data-value="people">人物</button>
      <button type="button" data-kind="view" data-value="schedule">作息</button>
      <button type="button" data-kind="view" data-value="manuals">功法</button>
      <button type="button" data-kind="view" data-value="events">事件与战斗 <span id="event-count" class="nav-count" hidden></span></button>
      <button type="button" data-kind="view" data-value="facilities">山门设施</button>
      <button type="button" data-kind="view" data-value="warehouse">宗门仓库</button>
      <button type="button" data-kind="view" data-value="journal">山门纪事</button>
    </nav>
    <div>
      <div class="view" data-view="overview">
        <section id="objective" class="panel chapter" tabindex="-1"></section>
        <section id="overview-roster" class="panel"></section>
      </div>
      <div class="view" id="building-page" data-view="dispatch" hidden><section id="assignments" class="panel" tabindex="-1"></section></div>
      <div class="view" id="map-page" data-view="map" hidden></div>
      <div class="view" data-view="people" hidden><section class="panel"><h2>人物档案</h2><div id="people"></div></section></div>
      <div class="view" data-view="schedule" hidden><section id="schedule-page" class="panel" tabindex="-1"></section></div>
      <div class="view" data-view="manuals" hidden><section id="manual-page" class="panel" tabindex="-1"></section></div>
      <div class="view" data-view="events" hidden>
        <section id="event" class="panel event" hidden></section>
        <section id="battle" class="panel" tabindex="-1" hidden></section>
        <section id="no-events" class="panel"><h2>暂无待处理事件</h2><p>历练遭遇和山门来访会出现在这里。</p></section>
      </div>
      <div class="view" data-view="facilities" hidden><section id="buildings" class="panel" tabindex="-1"></section></div>
      <div class="view" data-view="warehouse" hidden><section id="warehouse" class="panel" tabindex="-1"></section></div>
      <div class="view" data-view="journal" hidden><section class="panel log"><h2>山门纪事</h2><div id="journal"></div></section></div>
    </div>
  </div>
</div>
</main>
<script>
const events={
  echo:{
    title:'静室回音',
    text:'{name}打坐时听见地板下有水声，仿佛顺着呼吸一起涨落。',
    choices:[
      {label:'循声吐纳',delta:{herbs:-1,xp:2},result:'一株安神草压住杂念，{name}顺着水声多走了两个周天。'},
      {label:'掀板查看',delta:{stone:1},result:'{name}在地板下找到一枚垫着旧水脉图的灵石。'}
    ]
  },
  pulse:{
    title:'夜半逆息',
    text:'{name}行气到一半，烛火朝静室地缝倒伏，经脉也突然发冷。',
    choices:[
      {label:'温药调息',delta:{herbs:-2,xp:3},result:'药力驱散寒意，{name}记下了一套稳住气息的口诀。'},
      {label:'收功歇息',delta:{food:1},result:'{name}按时收功，把静室里没动过的干粮送回了库房。'}
    ]
  },
  notes:{
    title:'师父的批注',
    text:'{name}在吐纳册的夹页里发现一行字：「听见井鸣，当收半息。」',
    choices:[
      {label:'照批注练习',delta:{xp:2},result:'{name}放缓吐纳，体会到旧法里留的余地。'},
      {label:'整理散页',delta:{stone:2},result:'{name}归拢夹页，找出两枚夹在书套里的灵石。'}
    ]
  },
  moss:{
    title:'药畦生灵苔',

    case 'transmit':{
      const student=s.people[j.people[1]], book=transmissionBooks[j.arg];
      if(!own(student.mastery,book.name)){
        student.mastery[book.name]=0;
        if(book.art&&!student.known.includes(book.art))student.known.push(book.art);
        log(s,student.name+'从'+p.name+'处习得'+book.name+'。');
      }
      break;
    }
    case 'escort':case 'caravan':rewardTownJob(s,j.type);break;
    case 'explore':mark(s,'explored_'+j.arg);log(s,'发现'+discoveries[j.arg].name+'，现可派人采集。');break;
    case 'clearRocks':s.flags.quarryRocks=false;s.stock.masonry+=2;break;

    case 'harvest':{

      if(p.points>previous)log(s,p.name+'晋升至'+rankName(p)+'，获得 '+(p.points-previous)+' 点五维。');

      if(s.studyRounds>=1&&!p.rank)queue(s,'echo',j.people);
      if(s.studyRounds>=3&&!p.rank)queue(s,'notes',j.people);
      if(s.studyRounds>=5&&!p.rank)queue(s,'pulse',j.people);
      break;
    }
    case 'farm':

      s.stock.herbs+=2+proficiency+(mastered(p,manuals.wood.name)?1:0)+(s.built.farm?1:0)+(s.ditch===2?1:0);
      if(s.flags.seed>0&&!--s.flags.seed){s.stock.herbs+=4;log(s,'春种收成，额外入仓 4 普通药材。');}

      if(s.farmRounds>=2)queue(s,'ditch',j.people);
      if(s.farmRounds>=4)queue(s,'moss',j.people);
      if(s.farmRounds>=6)queue(s,'peddler',j.people);
      break;
    case 'hill':s.stock.herbs+=2;addXp(p,2);queue(s,'guest',j.people);break;
    case 'seek':s.stock.aux++;log(s,'队伍沿已知獾道绕行，带回筑基辅药。');break;
    case 'trail':mark(s,'trail','岩背獾巡路图');break;
    case 'outer':mark(s,'outer','荒庙外围勘图');queue(s,'lantern',j.people);break;
    case 'patrol':mark(s,'vine','缠藤术残页');queue(s,'boundary',j.people);break;
    case 'rain':s.stock.herbs+=2;break;
    case 'town':mark(s,'town','枯井水线记录');break;
    case 'temple':
      if(!s.flags.temple){mark(s,'temple','《青崖引泉诀》残卷');s.archive.push('旧水脉图');s.stock.stone+=3;}
      break;
    case 'brew':s.stock.pill++;break;
    case 'break':
      p.rank=true;
      s.flags.first??=p.name;
      break;
    case 'restore':mark(s,'restored');log(s,'旧阵恢复供用，石桥镇暂由邻井供水。');break;
    case 'seal':mark(s,'sealed');break;
    case 'ditch':
      s.ditch++;
      if(s.ditch===2){mark(s,'waterRecord','守泉人水脉记录');log(s,'旧渠复流，石桥镇的枯井重新出水。');}
      break;
    case 'canal':s.stock.herbs+=4;break;
    case 'forge':s.gear[j.arg]++;break;
    case 'repair':s.built[j.arg]=j.arg==='farm'?true:(Number(s.built[j.arg])||0)+1;break;
    case 'visitTown':s.townVisit={id:j.id,person:j.people[0]};break;
    case 'recruit':{
      const plan=annualRecruit(s);
      if(plan){plan.listed=true;log(s,p.name+'带回了第 '+plan.year+' 年的招徒名册。');}
      break;
    }
    case 'manual':learnManual(p,manuals[j.arg].name,manuals[j.arg].art);break;
    case 'learn':case 'vine':{
      const art=j.type==='learn'?'stone':'vine';
      if(art&&!p.known.includes(art))p.known.push(art);

    }
    case 'read':learnManual(p,streamManual,'stream');break;
    case 'heal':case 'qi':s.stock[j.type]++;break;
    case 'teach':case 'winter':{
      const student=s.people[j.people[1]];
      addXp(student,5);
      if(student.mentor===undefined)student.master=p.name;
      if(j.type==='teach')s.legacy=true;
      break;
    }
    case 'trade':s.stock.food+=j.arg==='autumn'?8:5;break;
  }
  log(s,p.name+'完成'+(own(industries,j.arg)?industryAction(j.type,j.arg):j.type==='repair'?repairs[j.arg][0]:j.type==='forge'?'打造'+gearNames[j.arg]:j.type==='manual'?'学习'+manuals[j.arg].name:tasks[j.type][0])+'。');
  practiceTrade(s,p,trade);
  const matchesSchedule=!p.schedule||!p.schedulePaused&&(
    scheduleMode(s,p)==='study'&&j.type==='meditate'||scheduleMode(s,p)==='duty'&&duties[p.duty]?.[1]===j.type&&!p.dutyPaused);
  if(j.repeat&&matchesSchedule&&!(j.type==='meditate'&&p.xp>=100&&!p.rank)){
    const spec=jobSpec(s,j.type,j.people);
    if(!spec.reason){
      const next={...j,id:++s.serial,end:s.time+spec.duration*minute};

function scheduledIndustryReason(s,industry){

function scheduleWaitReason(s,i){

  if(p.schedulePaused)return '自动安排已暂停';
  if(s.townVisit?.person===i)return '在石桥镇，返回山门后继续排班';
  if(p.dutyPaused&&(mode==='duty'||workMode===p.duty&&own(materialDuties,workMode)))return '职务已暂停';
  if(own(materialDuties,workMode)){
    const [id]=materialDuties[workMode];
    if(plannedMaterial(s,id)>=stockGoal(s,id))return resources[id]+'库存目标已足';
    return jobSpec(s,'harvest',[i],materialSite(p,workMode)).reason;
  }
  if(workMode==='smith'){
    if(!s.built.workshop)return '炼器工坊尚未建成';
    const choices=Object.keys(forgeRecipes).filter(id=>s.gear[id]+s.jobs.filter(j=>j.type==='forge'&&j.arg===id).length<stockGoal(s,id));
    if(!choices.length)return '炼器库存目标已足';
    return jobSpec(s,'forge',[i],choices[0]).reason;
  }
  if(workMode==='heal'){
    const choices=Object.keys(productionRecipes).filter(id=>needsBrew(s,id));
    return choices.length?jobSpec(s,choices[0],[i]).reason:'丹药库存目标已足';
  }
  const [,,industry]=scheduledWork[workMode]??[];
  const task=mode==='study'?'meditate':scheduledWork[workMode]?.[1];
  if(!task)return mode==='duty'?'未安排常驻职务':'';
  if(industry)return scheduledIndustryReason(s,industry)||jobSpec(s,task,[i],industry).reason;
  if(task==='patrol'&&available(s,'food')<4)return '可动用口粮不足 4';
  if(task==='patrol'&&s.jobs.some(j=>j.type==='patrol'))return '已有弟子巡山';
  return jobSpec(s,task,[i]).reason;
}
function assignDuties(s){
  let changed=false;
  const order=s.people.map((p,i)=>({p,i,leisure:scheduleMode(s,p)==='free'}));
  order.sort((a,b)=>Number(a.leisure)-Number(b.leisure));
  order.forEach(({p,i})=>{
    if(!free(s,i)||jobFor(s,i)||p.schedulePaused||s.townVisit?.person===i)return;
    const mode=scheduleMode(s,p);
    const duty=mode==='duty'&&!p.dutyPaused&&own(duties,p.duty)?duties[p.duty]:null;
    const alchemy=mode==='heal'||duty?.[1]==='heal';
    const recipe=alchemy&&Object.keys(productionRecipes).find(id=>needsBrew(s,id)&&!jobSpec(s,id,[i]).reason);
    if(mode==='free'||alchemy&&!recipe){
      if(fatigueOf(p)>=60){p.fatigueRest=true;changed=true;return;}
      const farmReason=available(s,'food')<4?'口粮不足'
        :roots(p).includes('木')?'木灵根擅长照料药草'
        :available(s,'herbs')<3?'可用药材不足':'静室暂时无法使用';
      const needsPractice=p.rank||p.xp<100;
      const practiceReason=p.rank?'继续精进修为':'继续积累修为';
      const farm=['farm',farmReason], practice=['meditate',practiceReason];
      const choices=farmReason==='静室暂时无法使用'?[practice,farm]:[farm,practice];
      const chosen=choices.find(([task])=>(task!=='meditate'||needsPractice)&&!jobSpec(s,task,[i]).reason);
      if(chosen&&!start(s,chosen[0],[i])){
        const job=jobFor(s,i);
        job.leisure=true;
        job.leisureReason=chosen[0]==='farm'&&!needsPractice&&farmReason==='静室暂时无法使用'
          ?'炼气修为已圆满':chosen[1];
        changed=true;
      }
      return;
    }
    const workMode=mode==='duty'?p.duty:mode;
    if(own(materialDuties,workMode)||workMode==='smith'){
      if(p.duty===workMode&&p.dutyPaused)return;
      let task,arg;
      if(workMode==='smith'){
        task='forge';
        arg=Object.keys(forgeRecipes).find(id=>s.gear[id]+s.jobs.filter(j=>j.type==='forge'&&j.arg===id).length<stockGoal(s,id)
          &&!jobSpec(s,task,[i],id).reason);
      }else{
        task='harvest';
        const [resource]=materialDuties[workMode];
        if(plannedMaterial(s,resource)<stockGoal(s,resource))arg=materialSite(p,workMode);
      }
      if(arg&&!start(s,task,[i],arg)){jobFor(s,i).duty=true;changed=true;}
      return;
    }
    const work=scheduledWork[mode];
    const task=recipe||(mode==='study'?'meditate':work?.[1]??duty?.[1]);
    if(!task)return;
    const industry=work?.[2]??(duty&&own(industries,p.duty)?p.duty:null);
    if(industry&&scheduledIndustryReason(s,industry))return;
    if(task==='patrol'&&(available(s,'food')<4||s.jobs.some(j=>j.type==='patrol')))return;
    if(!start(s,task,[i],industry??'')){
      jobFor(s,i).duty=!!duty;
      changed=true;
    }
  });
  return changed;
}
function tick(s,wall){
  if(!s.created)return false;
  const elapsed=Math.min(offlineCap,Math.max(0,wall-s.wall));
  if(!elapsed)return false;
  const end=s.time+elapsed;
  let changed=assignDuties(s);
  while(true){
    const j=s.jobs.filter(a=>a.end!==null&&a.end<=end).sort((a,b)=>a.end-b.end||a.id-b.id)[0];
    const recovery=s.people.filter(p=>(p.schedule&&!p.schedulePaused||p.duty&&!p.dutyPaused)&&p.rest>s.time&&p.rest<=end)
      .reduce((earliest,p)=>Math.min(earliest,p.rest),Infinity);
    const hourBoundary=(Math.floor(s.time/scheduleHour)+1)*scheduleHour;
    const rested=s.people.reduce((earliest,p,i)=>!jobFor(s,i)&&restingForFatigue(s,p)
      ?Math.min(earliest,fatigueRecovery(s,p)):earliest,Infinity);
    const checkpoint=Math.min(recovery,hourBoundary,rested);
    if(checkpoint<=end&&checkpoint<(j?.end??Infinity)&&checkpoint<(s.battle?.end??Infinity)){
      changed=advanceClock(s,checkpoint)||changed;changed=assignDuties(s)||changed;continue;
    }
    if(s.battle&&s.battle.end<=end&&(!j||s.battle.end<=j.end)){
      advanceClock(s,Math.max(s.time,s.battle.end));battleRound(s);assignDuties(s);changed=true;continue;
    }
    if(!j)break;
    advanceClock(s,Math.max(s.time,j.end));complete(s,j);assignDuties(s);changed=true;
  }
  const oldYear=Math.floor((end-elapsed)/(60*minute))+1;
  changed=advanceClock(s,end)||changed;s.wall=Math.max(wall,s.wall);
  const years=year(s)-oldYear;
  if(years){s.people.forEach(p=>p.age+=years);log(s,'接任第 '+year(s)+' 年，青云宗入春。');changed=true;}
  return assignDuties(s)||changed;
}

function eventOf(e){

function eventReason(s,e,choice,i){
  if(!choice||!e.people.includes(i))return '请选择在场的人。';
  if(choice.requirements&&!choice.requirements.some(([k,n])=>s.people[i].stats[k]>=n))
    return choice.requirements.map(([k,n])=>attributes[k]+'需 '+n+'，当前 '+s.people[i].stats[k]).join(' 或 ');
  if((choice.recruit||choice.candidate!==undefined)&&s.people.length>=capacity(s))return '厢房没有空位。';
  if(choice.recruit&&s.people.some(p=>p.name==='陆小满'))return '陆小满已经入门。';
  if(choice.candidate!==undefined&&s.people.some(p=>p.name===['顾芦','陶川'][choice.candidate]))return '此人已经入门。';
  const cost=Object.fromEntries(Object.entries(choice.delta).filter(([,n])=>n<0).map(([k,n])=>[k,-n]));
  return missing(s,cost);

function resolve(s,token,n,i){
  const e=s.eventQueue.find(e=>e.token===token);
  if(!e)return '此事已经处理。';
  if(s.battle?.token===token)return '战斗正在进行。';
  const choice=eventOf(e).choices[n];
  const reason=eventReason(s,e,choice,i);
  if(reason)return reason;
  const p=s.people[i];
  for(const [k,amount] of Object.entries(choice.delta)){
    if(k==='xp')addXp(p,amount);
    else s.stock[k]+=amount;
  }
  if(choice.flag)mark(s,choice.flag,choice.archive);
  if(choice.recruit)s.people.push(man());
  if(choice.candidate!==undefined)s.people.push(choice.candidate===0?
    makePerson('顾芦','木、水双灵根',[4,5,4,5,6,4],10,18):
    makePerson('陶川','金、木、火、土伪灵根',[5,4,6,5,4,4],10,20));
  const job=s.jobs.find(j=>j.id===e.job);
  if(job){
    finishJob(s,job);
    if(e.id==='ford')s.stock.herbs+=2;
    if(choice.special==='bypass')s.stock.aux++;
    if(choice.special==='retreat')mark(s,'trailOpen');
  }
  s.eventQueue=s.eventQueue.filter(a=>a.token!==token);
  log(s,withName(choice.result,p));
}

function battleDistance(a,b,width){

    if(battleDistance(cell,target,width)<=range)return first;
    const neighbors=[cell-width,cell+width];
    if(cell%width>0)neighbors.push(cell-1);
    if(cell%width<width-1)neighbors.push(cell+1);
    for(const next of neighbors){
      if(next<0||next>=width*4||visited.has(next)||occupied.has(next))continue;
      visited.add(next);queue.push([next,cell===from?next:first]);

        get.onsuccess=()=>{
          try{
            result=apply(get.result,command,Date.now());
            if(result.write)store.put(result.next,'current');
          }catch(error){tx.abort();reject(error);}
        };
      });
    }catch(error){
      console.error(error);
      return {next:state,message:'存档暂时无法写入，请重试。'};
    }
  }
  const update=()=>{
    const current=readLocal(key);
    const fallback=current??(temporary?structuredClone(state):null);
    const result=apply(fallback,command,Date.now());
    try{if(result.write)localStorage.setItem(key,JSON.stringify(result.next));}
    catch{temporary=true;}
    return result;
  };
  if(navigator.locks)return navigator.locks.request(key,update);
  return update();
}
async function sync(command){
  if(busy&&!command)return;
  if(command&&busy){
    await busy;
    return sync(command);
  }
  const pending=transaction(command);
  busy=pending;
  try{
    const {next,message}=await pending;
    state=next;
    const signature=state.revision+'|'+season(state)+'|'+gameHour(state)+'|'+state.people.map((p,i)=>free(state,i)?1:0).join('');
    if(signature!==lastSignature||command){lastSignature=signature;render();}
    if(command&&channel&&!message)channel.postMessage(state.revision);
    if(command||message||temporary)notice(message||(temporary?'浏览器限制了存档，本次进度仅保留在此页。':''));
  }finally{if(busy===pending)busy=false;}
}

function mapPath(from,to){
  const queue=[[from]],seen=new Set([from]);
  for(let i=0;i<queue.length;i++){
    const path=queue[i],end=path.at(-1);
    if(end===to)return path;
    for(const [a,b] of mapRoads){
      const next=a===end?b:b===end?a:null;
      if(next===null||seen.has(next))continue;
      seen.add(next);queue.push([...path,next]);
    }
  }
  return [from];
}

  hill:'hill',seek:'hill',patrol:'hill',ape:'hill',hunt:'hill',trail:'hill',rain:'hill',

function avatarPosition(s,i,time){
  const job=jobFor(s,i);
  const place=job&&(own(industries,job.arg)?job.arg:mapActivityPlaces[job.type]);
  const target=Number(Object.keys(mapTiles).find(tile=>mapTiles[tile]===place));
  const origin=job?.townOrigin===i?16:3;
  const path=mapPath(origin,Number.isFinite(target)?target:s.townVisit?.person===i?16:3);
  const stationary=(tile)=>({x:tile%7,y:Math.floor(tile/7),moving:false});
  if(!job&&!s.townVisit)return stationary(3);
  if(!job||job.end===null||!Number.isFinite(job.started)||path.length===1)return stationary(path.at(-1));
  const p=Math.max(0,Math.min(1,(time-job.started)/Math.max(1,job.end-job.started)));
  const waiting=job.type==='visitTown'||job.type==='hunt'||job.type==='ape'||job.type==='seek'&&!s.flags.trail||job.type==='rain'&&!s.seenEvents.includes('ford');
  const progress=job.type==='visitTown'?p:p<.25?p*4:waiting||p<=.75?1:(1-p)*4;
  const point=progress*(path.length-1),index=Math.floor(point),f=point-index;
  const a=stationary(path[index]),b=stationary(path[index+1]??path[index]);
  return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,moving:progress<1};
}
function positionMapAvatars(nodes,time){

    node.style.top='calc('+((pos.y+.5)/5*100)+'% - '+lift+'px)';

function activityStatus(p,i){
  const j=jobFor(state,i);
  if(j)return (restingForFatigue(state,p)?'本轮后休息 · ':j.leisure?'自主 · ':'')+(own(industries,j.arg)?industryAction(j.type,j.arg):j.type==='repair'?repairs[j.arg][0]:j.type==='forge'?'打造'+gearNames[j.arg]:j.type==='manual'?'学习'+manuals[j.arg].name:tasks[j.type][0])+' · '+(j.end===null?'等待处理':clock(j.end));
  if(state.townVisit?.person===i)return '在石桥镇 · 返回山门后继续排班';
  if(restingForFatigue(state,p))return '疲劳休息 · '+clock(fatigueRecovery(state,p))
    +(p.rest>state.time?' · 受伤休养 '+clock(p.rest):'');
  if(p.rest>state.time)return '休养 · '+clock(p.rest);

  if(!p.schedulePaused){
    const mode=scheduleMode(state,p),hour=gameHour(state);
    if(mode==='rest')return hour<6||hour>=22?'安睡':'静坐调息';
    if(mode==='free')return p.rank?'在山门散步':'在庭院活动';
  }
  const reason=scheduleWaitReason(state,i);
  return reason?'待命 · '+esc(reason):'待命';
}

function battlefieldMarkup(team,width,enemy,token,editable,enemyCell=width+Math.floor((width-1)/2)){
  const selected=editable&&boardSelection?.token===token?boardSelection.index:null;
  const rows=['敌方后排','敌方前排','我方前排','我方后排'];
  return (editable?'<p><small>先点弟子，再点格子布阵。近战 1 格、弓箭 3 格；够不到就自动移动。</small></p>':'')

    +rows.map((label,row)=>'<div class="battlefield-row"><small>'+label+'</small>'

        if(editable&&row<2)return '<div class="battle-cell enemy">·</div>';
        const slot=cell-2*width;

        const f=team[index],name=f?esc(state.people[f.i].name):'·';

        const label=rows[row]+' '+(col+1)+(f?' '+name:' 空位');

          +'" data-n="'+slot+'" aria-label="'+label+'" aria-pressed="'+(selected!==null&&index===selected)+'">'+name+'</button>'
          :'<div class="'+classes+'" aria-label="'+label+'">'+name+(f?.down?' · 倒地':'')+'</div>';

function selectBattleCell(token,slot){

function handle(e){
  const b=e.target.closest('button[data-kind]');if(!b||b.disabled)return;
  const {kind,value}=b.dataset, i=Number(b.dataset.i),n=Number(b.dataset.n),token=Number(b.dataset.token);
  if(kind==='pick-leader'){
    if(!assignment.partner.includes(i)||!free(state,i))return;
    const former=Number(assignment.leader);
    assignment.leader=String(i);
    assignment.partner=assignment.partner.map(n=>n===i?former:n);
    render();return;
  }
  if(kind==='pick-dispatch'){
    if(!free(state,i))return;
    selectedPersonExplicitly=true;
    if(value!=='team'||assignment.leader===''){
      assignment.leader=String(i);assignment.partner=[];
    }else if(assignment.leader===String(i)){
      const [next,...rest]=assignment.partner;
      assignment.leader=next===undefined?'':String(next);assignment.partner=rest;
    }else{
      assignment.partner=assignment.partner.includes(i)?assignment.partner.filter(n=>n!==i):[...assignment.partner,i];
    }
    render();(document.querySelector('#town-window[open]')??$('assignments')).querySelector('[data-kind="pick-dispatch"][data-i="'+i+'"]')?.focus({preventScroll:true});
    return;
  }
  if(kind==='visit-town'){sync({kind:'start',task:'visitTown',ids:[i]});return;}
  if(kind==='open-town'){if(state.townVisit){seenTownVisit=state.townVisit.id;chooseBuilding('town');assignment.leader=String(state.townVisit.person);selectedPersonExplicitly=true;$('town-window').showModal();refreshTownWindow();clocks();}return;}
  if(kind==='close-town'){$('town-window').close();return;}
  if(kind==='close'){popup?.close();overlay?.remove();overlay=null;return;}
  if(kind==='jump'){jump(value);return;}
  if(kind==='view'){showView(value);if(own(assignmentPages,value))$('assignments').innerHTML=assignmentMarkup();return;}
  if(kind==='schedule-brush'){scheduleBrush=value;$('schedule-page').innerHTML=scheduleMarkup();clocks();return;}
  if(kind==='schedule-cell'){sync({kind:'schedule',i,n,value:scheduleBrush});return;}
  if(kind==='schedule'){sync({kind,i,value,mode:scheduleBrush});return;}
  if(kind==='character'){
    selectedCharacter=i;
    $('people').innerHTML=peopleMarkup();$('manual-page').innerHTML=manualsMarkup();clocks();
    $('people').querySelector('[aria-pressed="true"]')?.focus({preventScroll:true});
    return;
  }
  if(kind==='map-tile'){
    selectedTile=n;
    const place=mapTiles[n];
    if(buildingActions[place])chooseBuilding(place);
    render();
    $('assignments').querySelector('[data-kind="map-tile"][aria-pressed="true"]')?.focus({preventScroll:true});
    return;
  }
  if(kind==='building'||kind==='task'){
    chooseBuilding(kind==='building'?value:selectedBuilding,kind==='task'?value:undefined);
    render();
    const selected=document.querySelector('#assignments [data-kind="'+kind+'"][aria-pressed="true"]');
    selected?.focus({preventScroll:true});
    return;
  }
  if(kind==='focus'){
    assignment.leader=String(i);assignment.partner=[];selectedPersonExplicitly=true;render();jump('assignments');return;
  }
  if(kind==='draft'){draft.stats[n]+=Number(b.dataset.delta);setup();return;}
  if(kind==='balance'){draft.stats=[7,7,7,6,6];setup();return;}
  if(kind==='create'){sync({kind,name:$('leader-name').value,stats:draft.stats.slice(),element:$('leader-root').value});return;}
  if(kind==='manual-filter'||kind==='manual-element'){
    if(kind==='manual-filter')manualCategory=value;
    else manualElement=value;
    $('manual-page').innerHTML=manualsMarkup();clocks();
    $('manual-page').querySelector('[data-kind="'+kind+'"][aria-pressed="true"]')?.focus({preventScroll:true});
    return;
  }
  if(kind==='trade-lesson'){sync({kind:'start',task:'apprentice',arg:value,ids:[state.people[i].mentor,i]});return;}
  if(kind==='transmit-book'){sync({kind:'start',task:'transmit',arg:value,ids:[state.people[i].mentor,i]});return;}
  if(kind==='study-book'){sync({kind:'start',task:value==='stream'?'read':'manual',arg:value,ids:[i]});return;}
  if(kind==='assign'){sync(assignmentCommand());return;}
  if(kind==='quick'){sync({kind:'start',task:value,ids:[i],repeat:value!=='hill'});return;}
  if(kind==='battle-cell'){
    selectBattleCell(token,n);render();
    $('battle').querySelector('[data-kind="battle-cell"][data-n="'+n+'"]')?.focus({preventScroll:true});
    return;
  }
  if(kind==='battle'){sync({kind,token,formation:structuredClone(formation[token].filter(f=>f.selected))});return;}
  sync({kind,value,i,n,token});
}
function change(e){
  const el=e.target,{field,eventActor,form,token,n,i,reserve,gear}=el.dataset;
  if(el.hasAttribute('data-schedule-person')){selectedCharacter=Number(el.value);render();return;}
  if(el.hasAttribute('data-work-goal')){if(el.value!=='')sync({kind:'work-goal',value:el.dataset.workGoal,n:el.valueAsNumber});return;}
  if(el.hasAttribute('data-worksite')){sync({kind:'worksite',i:Number(i),mode:el.dataset.worksite,value:el.value});return;}
  if(el.hasAttribute('data-duty')){sync({kind:'duty',i:Number(el.dataset.duty),value:el.value});return;}
  if(el.hasAttribute('data-companion')||el.hasAttribute('data-lesson')){
    selectedPersonExplicitly=true;
    if(el.hasAttribute('data-lesson'))assignment.partner=el.value===''?[]:[Number(el.value)];
    else{
      const member=Number(el.dataset.companion);
      assignment.partner=assignment.partner.filter(i=>i!==member);
      if(el.checked)assignment.partner.push(member);
    }
    render();return;
  }
  if(field){
    assignment[field]=el.type==='checkbox'?el.checked:el.value;
    if(field==='leader'){selectedPersonExplicitly=true;assignment.partner=assignment.partner.filter(i=>i!==Number(el.value));}
    render();return;
  }
  if(eventActor){eventActors[eventActor]=Number(el.value);render();return;}
  if(form){
    const f=formation[token][n];
    if(form==='selected')f.selected=el.checked;
    if(form==='slot')f.slot=Number(el.value);
    if(form==='heal')f.autoHeal=el.checked;
    if(form==='skill')f.skills[i]=el.value;
    render();return;
  }
  if(el.hasAttribute('data-manual-person')){selectedCharacter=Number(el.value);render();$('manual-page').querySelector('select').focus({preventScroll:true});return;}
  if(el.hasAttribute('data-root')&&el.value)sync({kind:'root',i:state.leader,value:el.value});
  if(el.hasAttribute('data-production-target')){
    if(el.value!=='')sync({kind:'production-target',value:el.dataset.productionTarget,n:el.valueAsNumber});
    return;
  }
  if(el.hasAttribute('data-food-floor')){
    if(el.value!=='')sync({kind:'food-floor',n:el.valueAsNumber});
    return;
  }
  if(reserve)sync({kind:'reserve',value:reserve,n:Number(el.value)});
  if(gear)sync({kind:'gear',slot:gear,i:Number(i),value:el.value});
}
document.addEventListener('click',handle);
document.addEventListener('change',change);
function mountMini(root){
  root.innerHTML='<div class="mini-heading"><strong>青云宗</strong><div class="actions">'+btn('回主界面','jump','data-value="objective"')+btn('收起','close')+'</div></div>'
    +'<section class="hero"><canvas aria-hidden="true"></canvas></section><small class="mini-calendar"></small><div class="strip"></div>'
    +'<p class="toast mini-notice" hidden></p><div class="mini-events"></div><div class="mini-people"></div>';
  render();
}
$('pip').onclick=async()=>{
  if(popup){popup.focus();return;}
  if(overlay){overlay.remove();overlay=null;return;}
  if(window.documentPictureInPicture&&window.top===window){
    try{
      const win=await window.documentPictureInPicture.requestWindow({width:440,height:425});
      popup=win;win.document.title='百年小宗 · 山门';win.document.documentElement.lang='zh-CN';
      win.document.head.append(document.querySelector('style').cloneNode(true));
      const mini=win.document.createElement('section');mini.className='mini';win.document.body.append(mini);
      win.document.addEventListener('click',handle);win.document.addEventListener('change',change);
      win.addEventListener('pagehide',()=>{popup=null;$('pip').textContent='开启画中画';});
      $('pip').textContent='查看画中画';mountMini(mini);return;
    }catch{}
  }
  overlay=document.createElement('section');overlay.className='mini float';document.body.append(overlay);
  mountMini(overlay);notice('已打开网页右下角小窗。');
};
function draw(canvas,time){
  const w=360,h=115;
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
  const c=canvas.getContext('2d');
  const box=(x,y,w,h,color)=>{c.fillStyle=color;c.fillRect(Math.floor(x),Math.floor(y),w,h);};
  const shape=(points,color)=>{c.fillStyle=color;c.beginPath();points.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fill();};
  const sky=c.createLinearGradient(0,0,0,115);sky.addColorStop(0,'#536e69');sky.addColorStop(.9,'#b8b591');box(0,0,w,h,sky);
  c.fillStyle='#ead5a0';c.beginPath();c.arc(283,26,12,0,Math.PI*2);c.fill();
  shape([[0,47],[25,37],[47,18],[61,29],[73,24],[112,58],[145,38],[162,44],[191,17],[216,37],[233,35],[271,64],[319,30],[337,39],[360,31],[360,115],[0,115]],'#6b847a');
  shape([[0,60],[40,46],[60,52],[84,48],[118,67],[147,59],[181,65],[223,48],[257,49],[291,70],[326,51],[360,61],[360,115],[0,115]],'#496b60');
  for(let i=0;i<7;i++){const x=(i*61+time/95)%410-50;box(x,51+i%3*7,35+i%3*11,1,'#dedfc244');}
  shape([[0,76],[45,69],[97,79],[143,72],[188,79],[231,69],[279,76],[330,64],[360,72],[360,115],[0,115]],'#35574b');
  shape([[0,94],[75,83],[148,92],[210,83],[281,92],[360,84],[360,115],[0,115]],'#28473b');
  shape([[0,108],[115,103],[227,89],[255,89],[210,97],[180,115],[0,115]],'#a19b74');
  for(const [x,y,s] of [[20,77,1],[61,86,1],[102,79,1],[141,82,1],[166,83,.8],[306,83,1],[333,73,1.2],[349,85,.8]]){
    box(x,y-12*s,2,15*s,'#443e30');
    for(let a=0;a<3;a++)shape([[x+1,y-(19-a*4)*s],[x-(5+a)*s,y-(11-a*4)*s],[x+(6+a)*s,y-(11-a*4)*s]],a===0?'#244339':'#203f34');
  }
  for(let i=0;i<4;i++){box(269+i*6,94+i%2*3,5,2,'#8a835c');box(270+i*6,92+i%2*3,2,3,'#a0a95b');}
  function hall(x,y,s){
    box(x,y,44*s,14*s,'#ad8a65');box(x-2*s,y+13*s,48*s,3*s,'#767960');
    for(const d of [3,38])box(x+d*s,y,3*s,13*s,'#663831');
    box(x+17*s,y+4*s,10*s,9*s,'#3c322a');box(x+9*s,y+5*s,4*s,4*s,'#edc579');box(x+30*s,y+5*s,4*s,4*s,'#edc579');
    shape([[x-8*s,y+2*s],[x+4*s,y-4*s],[x+15*s,y-12*s],[x+30*s,y-12*s],[x+40*s,y-4*s],[x+52*s,y+2*s]],'#232c2c');
    shape([[x-5*s,y],[x+11*s,y-6*s],[x+34*s,y-6*s],[x+49*s,y]],'#48605a');
    box(x+14*s,y-13*s,17*s,2*s,'#293935');
  }
  hall(193,76,.72);hall(229,71,1);
  state.people.forEach((p,i)=>{
    const active=jobFor(state,i);
    if(travel.has(active?.type))return;
    const x=(active?.type==='farm'?274:204)+i*10+(active?0:Math.sin(time/1000+i)*6);
    const y=(active?.type==='farm'?105:99)+i*2+(active?.type==='meditate'?0:Math.sin(time/190+i));
    box(x-1,y+7,7,1,'#20362e');box(x,y,5,2,'#283233');box(x+1,y+2,3,2,'#dfb786');
    box(x,y+4,5,3,['#d1d7c2','#768e8f','#c19963'][i%3]);box(x+1,y+7,3,1,'#333c36');
  });
}
function drawAll(time=Date.now()){
  if(!document.hidden)for(const canvas of document.querySelectorAll('canvas'))draw(canvas,time);
  if(popup&&!popup.closed)for(const canvas of popup.document.querySelectorAll('canvas'))draw(canvas,time);
}

document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});
sync();
setInterval(()=>{sync();clocks();drawAll();},500);
</script>
